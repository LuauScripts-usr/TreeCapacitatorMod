name: Build TreeCapacitor (MC 1.26.33.1)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Dobby (arm64-v8a)
        run: |
          echo "Cloning Dobby..."
          git clone --depth 1 https://github.com/jmpews/Dobby.git external/Dobby
          
          echo "Configuring Dobby with Ninja..."
          cmake -B external/Dobby/build -S external/Dobby \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=ON \
            -DDOBBY_DEBUG=OFF

          echo "Building Dobby..."
          cmake --build external/Dobby/build --config Release

      - name: Locate Dobby outputs
        id: dobby
        run: |
          LIB=$(find external/Dobby -name 'libdobby.so' | head -n 1)
          INC=$(find external/Dobby -name 'dobby.h' | head -n 1 | xargs dirname)
          echo "Found lib: $LIB"
          echo "Found inc: $INC"
          echo "lib=$LIB" >> $GITHUB_OUTPUT
          echo "inc=$INC" >> $GITHUB_OUTPUT

      - name: Configure and build mod
        run: |
          echo "Configuring TreeCapacitor..."
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_INCLUDE_DIR=${{ steps.dobby.outputs.inc }} \
            -DDOBBY_LIBRARY=${{ steps.dobby.outputs.lib }}
          
          echo "Building TreeCapacitor..."
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtree_capacitor-mc1.26.33.1-arm64
          path: build/libtree_capacitor.so
          retention-days: 90
